services:
  - type: web
    name: intellmeet-backend
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: builtin
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        value: intellmeet-recordings
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: VIDEO_PROVIDER_API_KEY
        sync: false
      - key: VIDEO_PROVIDER_API_SECRET
        sync: false
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
    disk:
      name: intellmeet-storage
      mountPath: /app/uploads
      sizeGB: 10
